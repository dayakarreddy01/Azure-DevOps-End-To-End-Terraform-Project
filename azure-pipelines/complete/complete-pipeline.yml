trigger:
  branches:
    include:
      - main

# Use Microsoft-hosted agent
pool:
  vmImage: 'windows-latest'   # or ubuntu-latest

variables:
  backendKey: "terraform.tfstate"
  azureServiceConnection: "terraform_consumpetion_logicapp1"
  approvalEmail: "v-alereddy@micorosoft.com"

stages:
- stage: Dev
  displayName: "Dev Environment"
  jobs:
  - template: terraform-template.yml
    parameters:
      environmentName: "dev"
      backendRG: "dev-dove-rg"
      backendSA: "devdovetfstate"
      backendKey: "$(backendKey)"
      azureServiceConnection: "$(azureServiceConnection)"
      approvalEmail: "$(approvalEmail)"

- stage: Test
  displayName: "Test Environment"
  dependsOn: Dev
  jobs:
  - template: terraform-template.yml
    parameters:
      environmentName: "test"
      backendRG: "test-goose-rg"
      backendSA: "testgoosetfstate"
      backendKey: "$(backendKey)"
      azureServiceConnection: "$(azureServiceConnection)"
      approvalEmail: "$(approvalEmail)"

- stage: Prod
  displayName: "Prod Environment"
  dependsOn: Test
  jobs:
  - template: terraform-template.yml
    parameters:
      environmentName: "prod"
      backendRG: "prod-wildcat-rg"
      backendSA: "prodwildcattfstate"
      backendKey: "$(backendKey)"
      azureServiceConnection: "$(azureServiceConnection)"
      approvalEmail: "$(approvalEmail)"
